name: Skill feedback
description: A skill or agent did something wrong or missed a scenario on a POC
labels: ["feedback"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill or agent
      description: For example build, profile, researcher, designer, coder
    validations:
      required: true
  - type: input
    id: poc
    attributes:
      label: POC or client
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - Signal capture / research
        - Scoping (BRD)
        - Design system
        - Build (Nebula)
        - Test users / RBAC
        - Collaterals
        - Other
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should have done
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Inputs, output or screenshots
